    const balls = [];
    var playerId;
    document.addEventListener('DOMContentLoaded', async (event) => {
        const ballResponse = await fetch("/ballscalled"); 
        if(ballResponse.ok) { 
            const ballNums = await ballResponse.json();
            balls.push(...ballNums)
        }
        
        const playerResponse = await fetch('/is-player');
        if(!playerResponse.ok) {
            console.error('Error checking player status:', playerResponse.statusText);
        } else {
            const playerStatus = await playerResponse.json();
            if(playerStatus.isPlayer) {
                playerId = playerStatus.playerId; 
                // console.log(playerId)
            } else {
                const fetchPlayerData = { 
                    method: "POST", 
                }; 
                
                const newPlayerResponse = await fetch("/newplayer", fetchPlayerData); 
                if(newPlayerResponse.ok) { 
                    const playerStatus = await newPlayerResponse.json();
                    playerId = playerStatus.playerId;
                    // console.log(playerId)
                    // playerId = 1;
                } 
                else {
                    console.log("Error creating player"); 
                }

                const cardQuery = { 
                    playerId
                }; 
                // console.log(cardQuery)
                
                const fetchCardData = { 
                    method: "POST", 
                    body: JSON.stringify(cardQuery),  
                    headers: { 
                        "Content-Type": "application/json" 
                    } 
                }; 
                
                const newCardResponse = await fetch("/insertcard", fetchCardData); 
                if(newCardResponse.ok) { 
                    //success
                } 
                else {
                    console.log("Error inserting card"); 
                }
            }
        }
        
        // console.log(playerId);
        (async() => {
                await loadAllCards(); 
                refreshListeners(); 
            })()
    });

    //websocket
    const socket = new WebSocket('wss://disloyal-unsoiled-backfire.ngrok-free.dev');

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'ballCalled') {
            // console.log('New ball called. All balls:', data.balls);
            //clear balls array
            balls.length = 0; 
            //repopulate array
            balls.push(...data.balls); 
            balls.reverse(); 
            refreshListeners(); 
        }

        if (data.type === 'ballsReset') {
            console.log('Balls have been reset');
            balls.length = 0; 
            (async() => {
                await loadAllCards(); 
                refreshListeners();
            })()
        }
    };

    document.addEventListener('squareChecked', (event) => {
        // const { ballNum } = event.detail;
        // console.log(ballNum)
        const cards = document.querySelectorAll('bingo-card');
            cards.forEach(card => {
                const checkedSquares = []
                const squares = card.shadowRoot.querySelectorAll('bingo-square');
                squares.forEach(square => {
                    if (square.getAttribute('has-been-clicked') === '1') {
                        checkedSquares.push(1); 
                    } else {
                        checkedSquares.push(0); 
                    }
                });
                if (isBingo(checkedSquares)) {
                    socket.send(JSON.stringify({ type: 'bingo' }));

                } 
                // console.log(checkedSquares); 
            });
        
    });

    async function loadAllCards() { 
        const table = document.getElementById("cardContainer"); 

        // const cardQuery = { 
        //     playerId: playerId
        // }; 
        
        // console.log(cardQuery);
        // const queryString = new URLSearchParams(cardQuery).toString();
        // console.log(queryString);
        // console.log(playerId);
        const cardResponse = await fetch(`/playercards?playerId=${playerId}`); 

        if(cardResponse.ok) { 
            const cards = await cardResponse.json();
            table.innerHTML = ""; 
            cards.forEach(card => { 
                const cardElement = document.createElement("bingo-card"); 
                cardElement.setAttribute('bingo-card-nums', card.PlayerCard);
                table.appendChild(cardElement); 
            }); 
        
        } else { 
            console.log("Error with the response data"); 
        }
 
        
    }

    function loadAllBalls(balls) { 
        const table = document.getElementById("ballContainerInner"); 
 
        table.innerHTML = ""; 
        // console.log(balls.length);
        balls.forEach(ball => { 
            const ballElement = document.createElement("bingo-ball"); 
            ballElement.setAttribute('bingo-number', ball);
            table.appendChild(ballElement); 
        }); 
    }

    function refreshListeners() {
        try {
            loadAllBalls(balls)

            const cards = document.querySelectorAll('bingo-card');
            cards.forEach(card => {
                const squares = card.shadowRoot.querySelectorAll('bingo-square');
                squares.forEach(square => {
                    if (square.getAttribute('bingo-number') == 'FREE') {
                        square.setAttribute('has-been-called', '1');
                    } else {
                        let num = parseInt(square.getAttribute('bingo-number'));
                        if (balls.includes(num)) {
                            square.setAttribute('has-been-called', '1');
                        } 
                        var oldBalls = []; 
                        if (balls.length > 5) {
                            oldBalls = balls.slice(5);
                            // console.log(oldBalls)
                        } 
                        if (oldBalls.includes(num)) {
                            // console.log(num);
                            square.setAttribute('has-been-a-while', '1');
                        } 
                    }


                    const idString = `bingo-square-${square.getAttribute('bingo-number')}`
                    square.shadowRoot.getElementById(idString).addEventListener('click', () => {
                        if (square.getAttribute('has-been-called') === '1') {
                            // square.setAttribute('has-been-called', '1');
                            // console.log(square.getAttribute('has-been-called'));
                            square.setAttribute('has-been-clicked', '1');
                            square.setAttribute('has-a-while', '0'); 
                        } else {
                            // console.log('Button clicked!');
                            // console.log(square.getAttribute('has-been-called'));
                            // square.setAttribute('has-been-called', '1');
                        }

                    });
                    
                });
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }

    function isBingo(checkedSquares) {
        let retVal = false; 
        if (checkVerticalBingos(checkedSquares) || checkHorizontalBingos(checkedSquares) || checkDiagonalBingos(checkedSquares)) {
            retVal = true; 
        }
        return retVal; 
    }

    function checkVerticalBingos(checkedSquares) {
        let retVal = false;
        //B
        if (checkedSquares[0] && checkedSquares[5] && checkedSquares[10] && checkedSquares[15] && checkedSquares[20]) {
            // console.log("Bingo on B")
            retVal = true; 
        }
        //I
        if (checkedSquares[1] && checkedSquares[6] && checkedSquares[11] && checkedSquares[16] && checkedSquares[21]) {
            // console.log("Bingo on I")
            retVal = true; 
        }
        //N
        if (checkedSquares[2] && checkedSquares[7] && checkedSquares[12] && checkedSquares[17] && checkedSquares[22]) {
            // console.log("Bingo on N")
            retVal = true; 
        }
        //G
        if (checkedSquares[3] && checkedSquares[8] && checkedSquares[13] && checkedSquares[18] && checkedSquares[23]) {
            // console.log("Bingo on G")
            retVal = true; 
        }
        //0
        if (checkedSquares[4] && checkedSquares[9] && checkedSquares[14] && checkedSquares[19] && checkedSquares[24]) {
            // console.log("Bingo on 0")
            retVal = true; 
        }
        return retVal;
    }
    function checkHorizontalBingos(checkedSquares) {
        let retVal = false;
        //row 1
        if (checkedSquares[0] && checkedSquares[1] && checkedSquares[2] && checkedSquares[3] && checkedSquares[4]) {
            // console.log("Bingo on row 1")
            retVal = true; 
        }
        //row 2
        if (checkedSquares[5] && checkedSquares[6] && checkedSquares[7] && checkedSquares[8] && checkedSquares[9]) {
            // console.log("Bingo on row 2")
            retVal = true; 
        }
        //row 3
        if (checkedSquares[10] && checkedSquares[11] && checkedSquares[12] && checkedSquares[13] && checkedSquares[14]) {
            // console.log("Bingo on row 3")
            retVal = true; 
        }
        //row 4
        if (checkedSquares[15] && checkedSquares[16] && checkedSquares[17] && checkedSquares[18] && checkedSquares[19]) {
            // console.log("Bingo on row 4")
            retVal = true; 
        }
        //row 5
        if (checkedSquares[20] && checkedSquares[21] && checkedSquares[22] && checkedSquares[23] && checkedSquares[24]) {
            // console.log("Bingo on row 5")
            retVal = true; 
        }
        return retVal;
    }
    function checkDiagonalBingos(checkedSquares) {
        let retVal = false;
        //NW to SE
        if (checkedSquares[0] && checkedSquares[6] && checkedSquares[12] && checkedSquares[18] && checkedSquares[24]) {
            // console.log("Bingo on diagonal 1")
            retVal = true;

        //SW to NE

            retVal = true;

        return retVal;
