    document.getElementById("callBallButton").addEventListener("click", async (e) => {
        e.preventDefault(); 
        try {
            const ballsNotCalled = []; 
            for (let i = 1; i <= 75; i++) {
                if (!balls.includes(i)) {
                    ballsNotCalled.push(i);
                }
            
            }
            if (ballsNotCalled.length > 0) {
                const randomBallIndex = Math.floor(Math.random() * ballsNotCalled.length);
                // console.log(ballsNotCalled[randomBallIndex]);
                balls.unshift(ballsNotCalled[randomBallIndex]);
                
                const ballNum = ballsNotCalled[randomBallIndex];

                const ballquery = { 
                    ballNum
                }; 

                const fetchConfigData = { 
                    method: "POST", 
                    body: JSON.stringify(ballquery),  
                    headers: { 
                        "Content-Type": "application/json" 
                    } 
                }; 
    
                const response = await fetch("/allcalledballs", fetchConfigData); 
                if(response.ok) { 
                    //success
                } else { 
                    console.log("Error with the response data"); 
                }

                refreshListeners();
            }
            
            
        } catch (err) { 
            console.log(`Error: ${err}`); 
        }
    });

    function BingoAlert() { 
        //unhide alter
        const button = document.getElementById("bingoAlertButton"); 
        button.hidden = false;
    }

    function loadAllCards(cards) { 
        const table = document.getElementById("cardContainer"); 
 
        table.innerHTML = ""; 
 
        cards.forEach(card => { 
            const cardElement = document.createElement("bingo-card"); 
            cardElement.setAttribute('bingo-card-nums', card.PlayerCard);
            table.appendChild(cardElement); 
        }); 
    }

    document.getElementById("bingoAlertButton").addEventListener("click", async (e) => {
        e.preventDefault(); 

        //hide alert again 
        const button = document.getElementById("bingoAlertButton"); 
        button.hidden = true;
    });

    function load5Balls(balls) { 
        const table = document.getElementById("ballContainerInner"); 
 
        table.innerHTML = ""; 
        // console.log(balls.length);
        const ballElement1 = document.createElement("bingo-ball"); 
        if (balls.length > 0) {
            ballElement1.setAttribute('bingo-number', balls[0]);
            table.appendChild(ballElement1); 
            ballElement1.setAttribute('size', 100); 
        }

        const fourBalls = balls.slice(1,5) 
        
        fourBalls.forEach(ball => { 
            const ballElement = document.createElement("bingo-ball"); 
            ballElement.setAttribute('bingo-number', ball);
            table.appendChild(ballElement); 
        }); 
    }

    function refreshListeners() {
        try {
            load5Balls(balls)

            const cards = document.querySelectorAll('bingo-display');
            cards.forEach(card => {
                const squares = card.shadowRoot.querySelectorAll('display-square');
                squares.forEach(square => {
                    const num = parseInt(square.getAttribute('bingo-number'));
                    if (balls.includes(num)) {
                        square.setAttribute('has-been-called', '1');
                        if (balls[0] == num) {
                            square.setAttribute('most-recent', '1');
                        } else {
                            square.setAttribute('most-recent', '0');
                        }
                    } else {
                        square.setAttribute('has-been-called', '0');
                    }
