    <title>Bingo Login</title>

<body>
   <div class="container">
        <auth-box> </auth-box>
    </div>
</body>

<script>
    document.addEventListener('DOMContentLoaded', async (event) => {
        try {
                const response2 = await fetch('/am-i-loggedin');
                if(response2.ok) {
                    const loginStatus = await response2.json();
                    if(loginStatus.loggedIn) {
                        const authBox = document.querySelector('auth-box');
                        authBox.setAttribute('username', loginStatus.username);
                    } 
                } else {
                    console.error('Error checking login:', response2.statusText);
                }
            } catch (error) {
                console.error('Error:', error);
            }
    });

    document.addEventListener('login', async (event) => {
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: event.detail.username,
                        password: event.detail.password
                    })
                });

                // const legendTable = document.querySelector('csl-legend-table');

                if (response.ok) {
                    const authBox = document.querySelector('auth-box');
                    authBox.setAttribute('username', event.detail.username);

                    // legendTable.setAttribute('user-logged-in', true);
                } else {
                    // legendTable.setAttribute('user-logged-in', false);
                    console.error('Login failed');
                }
            } catch (err) {
                console.error('Login error', err);
            }
        });

        document.addEventListener('logout', async (event) => {
            try {
                const response = await fetch('/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    // const legendTable = document.querySelector('csl-legend-table');
                    // legendTable.setAttribute('user-logged-in', false);

                    const authBox = document.querySelector('csl-auth-box');
                    authBox.setAttribute('username', '');
                } else {
                    console.log('Error with the logout response data');
                }
            } catch (err) {
                console.log(`Error: ${err}`);
            }
        });

        document.addEventListener('register', async (event) => {
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: event.detail.username,
                        password: event.detail.password
                    })
                });

                // const legendTable = document.querySelector('csl-legend-table');

                if (response.ok) {
                    const authBox = document.querySelector('auth-box');
                    authBox.setAttribute('username', event.detail.username);

                    // legendTable.setAttribute('user-logged-in', true);
                } else {
                    // legendTable.setAttribute('user-logged-in', false);
                    console.error('Login failed');
                }
            } catch (err) {
                console.error('Login error', err);
            }
        });
</script>

</html>
